<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradErgo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f7f5f0" />
    </linearGradient>
    
    <!-- Ergonomic Calm Palette: Muted Terracotta -> Soft Amber -> Calm Forest Sage -->
    <linearGradient id="primaryGradErgo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c86d3b" />
      <stop offset="50%" stop-color="#d4a373" />
      <stop offset="100%" stop-color="#386641" />
    </linearGradient>

    <linearGradient id="penGradErgo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9c46a" />
      <stop offset="100%" stop-color="#c86d3b" />
    </linearGradient>

    <filter id="glowErgo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Soft warm card background -->
  <rect width="600" height="200" rx="24" fill="url(#bgGradErgo)" stroke="#e5e0d5" stroke-width="2" />

  <!-- Icon group -->
  <g transform="translate(45, 35)">
    <circle cx="65" cy="65" r="55" fill="none" stroke="#dcd5c9" stroke-width="2" stroke-dasharray="4 4" />
    <path d="M 25,85 C 45,25 85,105 105,45" fill="none" stroke="url(#primaryGradErgo)" stroke-width="7.5" stroke-linecap="round" filter="url(#glowErgo)" />
    <g transform="translate(103, 42) rotate(-45)">
      <path d="M 0,0 L 10,-20 L -10,-20 Z" fill="url(#penGradErgo)" />
      <polygon points="0,0 3,-6 -3,-6" fill="#ffffff" />
      <circle cx="0" cy="0" r="2" fill="#386641" />
    </g>
    <circle cx="25" cy="85" r="5" fill="#ffffff" stroke="#c86d3b" stroke-width="2.5" />
    <circle cx="105" cy="45" r="5" fill="#ffffff" stroke="#386641" stroke-width="2.5" />
  </g>

  <!-- Typography / Text group -->
  <g transform="translate(195, 112)">
    <text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#212529" letter-spacing="-1">
      Draw<tspan fill="url(#primaryGradErgo)">ItOut</tspan>
    </text>
    <text y="32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#576270" letter-spacing="4">
      ONLINE MULTIPLAYER DRAWING
    </text>
  </g>
</svg>
