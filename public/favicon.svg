<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGradFavErgo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c86d3b" />
      <stop offset="50%" stop-color="#d4a373" />
      <stop offset="100%" stop-color="#386641" />
    </linearGradient>

    <linearGradient id="penGradFavErgo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9c46a" />
      <stop offset="100%" stop-color="#c86d3b" />
    </linearGradient>

    <filter id="glowFavErgo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Soft warm card -->
  <rect width="128" height="128" rx="28" fill="#ffffff" stroke="#e5e0d5" stroke-width="2" />

  <g transform="translate(-1, 0) scale(0.95)">
    <circle cx="65" cy="65" r="48" fill="none" stroke="#dcd5c9" stroke-width="2" stroke-dasharray="4 4" />
    <path d="M 30,85 C 50,30 85,100 102,48" fill="none" stroke="url(#primaryGradFavErgo)" stroke-width="6.5" stroke-linecap="round" filter="url(#glowFavErgo)" />
    
    <g transform="translate(100, 45) rotate(-45)">
      <path d="M 0,0 L 9,-18 L -9,-18 Z" fill="url(#penGradFavErgo)" />
      <polygon points="0,0 2.5,-5 -2.5,-5" fill="#ffffff" />
      <circle cx="0" cy="0" r="2" fill="#386641" />
    </g>
    
    <circle cx="30" cy="85" r="4.5" fill="#ffffff" stroke="#c86d3b" stroke-width="2.5" />
    <circle cx="102" cy="48" r="4.5" fill="#ffffff" stroke="#386641" stroke-width="2.5" />
  </g>
</svg>
